name: Test

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      nginx_ref:
        description: nginx-ext branch, tag or commit
        default: '1.31.7'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.repository == 'HanadaLee/ngx_ssl_fingerprint_module'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out module
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check out nginx-ext
        uses: actions/checkout@v6
        with:
          repository: HanadaLee/nginx-ext
          ref: ${{ inputs.nginx_ref || '1.31.7' }}
          path: .ci/nginx
          persist-credentials: false

      - name: Check out openssl
        uses: actions/checkout@v6
        with:
          repository: openssl/openssl
          ref: openssl-3.5.9
          path: .ci/openssl
          persist-credentials: false

      - name: Check out nginx-tests
        uses: actions/checkout@v6
        with:
          repository: nginx/nginx-tests
          path: .ci/nginx-tests
          persist-credentials: false

      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libpcre2-dev \
            libssl-dev \
            zlib1g-dev \
            perl \
            pkg-config \
            libio-socket-ssl-perl

      - name: Build and test
        env:
          TEST_EXPR: disabled
        run: bash util/run-tests.sh

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-disabled
          path: |
            .ci/test-output/**/*.log
            .ci/test-output/run.log
            t/servroot/logs/
            servroot/logs/
          if-no-files-found: ignore
